<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小乔智投 icon 交互动画预览</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #2563eb;
      --brand-2: #2e75fe;
      --deep: #0b1f3a;
      --cyan: #14b8a6;
      --bg: #f6f8fc;
      --panel: rgba(255, 255, 255, 0.82);
      --line: rgba(37, 99, 235, 0.12);
      --shadow: 0 18px 50px rgba(11, 31, 58, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "HarmonyOS Sans", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--deep);
      background:
        radial-gradient(circle at 20% 15%, rgba(46, 117, 254, 0.10), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(20, 184, 166, 0.08), transparent 24%),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 48%, #eef4ff 100%);
      overflow-x: hidden;
    }

    .page {
      width: min(1120px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 54px 0 72px;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 640px;
      color: #52627a;
      font-size: 14px;
      line-height: 1.8;
    }

    .hint {
      padding: 8px 12px;
      border: 1px solid rgba(37, 99, 235, 0.14);
      border-radius: 999px;
      color: #37527a;
      background: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      min-height: 520px;
      border: 1px solid rgba(37, 99, 235, 0.10);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.56)),
        radial-gradient(circle at 46% 38%, rgba(37, 99, 235, 0.08), transparent 30%);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(37, 99, 235, 0.16) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(20, 184, 166, 0.12) 0 1px, transparent 1.5px);
      background-size: 48px 48px, 72px 72px;
      background-position: 0 0, 18px 14px;
      opacity: 0.18;
      mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
      animation: particleDrift 22s linear infinite;
      pointer-events: none;
    }

    .preview-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 32px;
      min-height: 520px;
      padding: 44px;
      z-index: 1;
    }

    .main-preview {
      display: grid;
      place-items: center;
      min-height: 420px;
    }

    .icon-button {
      position: relative;
      width: 220px;
      height: 220px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 48px;
      background: transparent;
      cursor: pointer;
      padding: 0;
      outline: none;
      transform: translateZ(0);
    }

    .icon-button::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 46px;
      background:
        radial-gradient(circle at 48% 48%, rgba(46, 117, 254, 0.22), transparent 42%),
        conic-gradient(from 145deg, transparent, rgba(46, 117, 254, 0.18), transparent 34%);
      filter: blur(20px);
      opacity: 0.44;
      transform: scale(0.94);
      transition: opacity 260ms cubic-bezier(0.4, 0, 0.2, 1), transform 260ms cubic-bezier(0.4, 0, 0.2, 1);
      animation: haloBreath 3.8s ease-in-out infinite;
    }

    .icon-button::after {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 1px solid rgba(37, 99, 235, 0.18);
      opacity: 0;
      transform: scale(0.84);
      transition: opacity 260ms cubic-bezier(0.4, 0, 0.2, 1), transform 260ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-button:hover::before,
    .icon-button:focus-visible::before,
    .icon-button.is-active::before {
      opacity: 0.86;
      transform: scale(1.04);
    }

    .icon-button:hover::after,
    .icon-button:focus-visible::after,
    .icon-button.is-active::after {
      opacity: 1;
      transform: scale(1);
      animation: ripple 1.9s ease-out infinite;
    }

    .xiaoqiao-icon {
      position: relative;
      width: 168px;
      height: 168px;
      overflow: visible;
      filter: drop-shadow(0 18px 24px rgba(37, 99, 235, 0.18));
      transform-origin: center;
      transition: transform 260ms cubic-bezier(0.4, 0, 0.2, 1), filter 260ms cubic-bezier(0.4, 0, 0.2, 1);
      animation: iconIdle 4.6s ease-in-out infinite;
    }

    .icon-button:hover .xiaoqiao-icon,
    .icon-button:focus-visible .xiaoqiao-icon,
    .icon-button.is-active .xiaoqiao-icon {
      transform: translateY(-4px) scale(1.035);
      filter: drop-shadow(0 22px 30px rgba(37, 99, 235, 0.26));
    }

    .outer-mark {
      transform-origin: 84px 84px;
      animation: outerFloat 8s ease-in-out infinite;
    }

    .spark-track {
      opacity: 0;
      stroke-dasharray: 22 420;
      stroke-dashoffset: 0;
      transform-origin: 84px 84px;
      transition: opacity 220ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-button:hover .spark-track,
    .icon-button:focus-visible .spark-track,
    .icon-button.is-active .spark-track {
      opacity: 1;
      animation: sparkRun 1.8s linear infinite;
    }

    .eye {
      transform-origin: center;
      animation: eyePulse 2.4s ease-in-out infinite;
    }

    .eye.right {
      animation-delay: 180ms;
    }

    .icon-button:hover .eye,
    .icon-button.is-active .eye {
      animation-duration: 1.4s;
    }

    .state-dot {
      position: absolute;
      right: 42px;
      top: 44px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 7px rgba(20, 184, 166, 0.14), 0 0 22px rgba(20, 184, 166, 0.42);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .icon-button.is-active .state-dot {
      opacity: 1;
      transform: scale(1);
      animation: statePulse 1.5s ease-in-out infinite;
    }

    .side {
      align-self: center;
      display: grid;
      gap: 14px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(11, 31, 58, 0.06);
      padding: 18px;
    }

    .card-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.8;
    }

    .sizes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: end;
    }

    .size-demo {
      display: grid;
      place-items: center;
      min-height: 88px;
      border-radius: 14px;
      background: rgba(246, 248, 252, 0.72);
      border: 1px solid rgba(37, 99, 235, 0.08);
    }

    .mini {
      width: var(--s);
      height: var(--s);
      filter: drop-shadow(0 6px 10px rgba(37, 99, 235, 0.15));
      animation: iconIdle 4.6s ease-in-out infinite;
    }

    .mini .outer-mark {
      animation: outerFloat 8s ease-in-out infinite;
    }

    .mini .eye {
      animation: eyePulse 2.4s ease-in-out infinite;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 16px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.8;
    }

    .status {
      color: #315a96;
    }

    @keyframes particleDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(48px, 24px, 0); }
    }

    @keyframes haloBreath {
      0%, 100% { filter: blur(20px); transform: scale(0.94); }
      50% { filter: blur(28px); transform: scale(1.02); }
    }

    @keyframes iconIdle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.01); }
    }

    @keyframes outerFloat {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg); }
    }

    @keyframes eyePulse {
      0%, 100% { transform: scale(1); opacity: 0.96; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes sparkRun {
      from { stroke-dashoffset: 0; transform: rotate(0deg); }
      to { stroke-dashoffset: -442; transform: rotate(360deg); }
    }

    @keyframes ripple {
      0% { opacity: 0.72; transform: scale(0.88); }
      70% { opacity: 0; transform: scale(1.18); }
      100% { opacity: 0; transform: scale(1.18); }
    }

    @keyframes statePulse {
      0%, 100% { box-shadow: 0 0 0 7px rgba(20, 184, 166, 0.14), 0 0 22px rgba(20, 184, 166, 0.42); }
      50% { box-shadow: 0 0 0 12px rgba(20, 184, 166, 0.08), 0 0 30px rgba(20, 184, 166, 0.55); }
    }

    @media (max-width: 820px) {
      .page {
        width: min(100vw - 24px, 680px);
        padding-top: 28px;
      }

      .header,
      .footer {
        display: block;
      }

      .hint {
        display: inline-block;
        margin-top: 14px;
      }

      .preview-grid {
        grid-template-columns: 1fr;
        padding: 26px 18px;
      }

      .main-preview {
        min-height: 310px;
      }

      .icon-button {
        width: 190px;
        height: 190px;
      }

      .xiaoqiao-icon {
        width: 146px;
        height: 146px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>小乔智投 icon 交互动画预览</h1>
        <p class="lead">独立动画稿，不替换现有页面资产。点击主图标可切换激活态，悬停可查看轻量光效、眼点脉冲和环形流动效果。</p>
      </div>
      <div class="hint">状态：独立预览，不影响线上模块</div>
    </header>

    <section class="stage" aria-label="icon 动画预览">
      <div class="preview-grid">
        <div class="main-preview">
          <button class="icon-button" type="button" aria-label="切换小乔智投图标激活态">
            <svg class="xiaoqiao-icon" viewBox="0 0 168 168" role="img" aria-label="小乔智投">
              <defs>
                <linearGradient id="markGradient" x1="22" y1="28" x2="146" y2="142" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#2563eb" />
                  <stop offset="0.46" stop-color="#1677ff" />
                  <stop offset="1" stop-color="#0052d9" />
                </linearGradient>
                <radialGradient id="eyeGradient" cx="35%" cy="28%" r="72%">
                  <stop offset="0" stop-color="#123d7f" />
                  <stop offset="1" stop-color="#071f49" />
                </radialGradient>
                <linearGradient id="sparkGradient" x1="0" y1="0" x2="168" y2="168" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="rgba(255,255,255,0)" />
                  <stop offset="0.45" stop-color="#ffffff" />
                  <stop offset="1" stop-color="rgba(255,255,255,0)" />
                </linearGradient>
              </defs>
              <path class="outer-mark" d="M137.5 49.5C124.4 29.4 102.2 17 78.2 17C39.5 17 8 48.5 8 87.2C8 125.9 39.5 157.4 78.2 157.4C109.4 157.4 136.7 136.8 145.3 107.2" fill="none" stroke="url(#markGradient)" stroke-width="28" stroke-linecap="round" />
              <path class="spark-track" d="M137.5 49.5C124.4 29.4 102.2 17 78.2 17C39.5 17 8 48.5 8 87.2C8 125.9 39.5 157.4 78.2 157.4C109.4 157.4 136.7 136.8 145.3 107.2" fill="none" stroke="url(#sparkGradient)" stroke-width="30" stroke-linecap="round" />
              <circle class="eye left" cx="66" cy="86" r="10.8" fill="url(#eyeGradient)" />
              <circle class="eye right" cx="102" cy="86" r="10.8" fill="url(#eyeGradient)" />
            </svg>
            <span class="state-dot" aria-hidden="true"></span>
          </button>
        </div>

        <aside class="side">
          <article class="card">
            <h2 class="card-title">动效策略</h2>
            <p>默认态轻微呼吸，hover 时图标上浮和蓝色柔光增强，点击后出现青绿色状态点，表达“AI 正在工作”。</p>
          </article>
          <article class="card">
            <h2 class="card-title">尺寸验证</h2>
            <div class="sizes" aria-label="不同尺寸预览">
              <div class="size-demo">
                <svg class="mini" style="--s: 36px" viewBox="0 0 168 168" aria-hidden="true">
                  <path class="outer-mark" d="M137.5 49.5C124.4 29.4 102.2 17 78.2 17C39.5 17 8 48.5 8 87.2C8 125.9 39.5 157.4 78.2 157.4C109.4 157.4 136.7 136.8 145.3 107.2" fill="none" stroke="#2563eb" stroke-width="28" stroke-linecap="round" />
                  <circle class="eye" cx="66" cy="86" r="10.8" fill="#071f49" />
                  <circle class="eye" cx="102" cy="86" r="10.8" fill="#071f49" />
                </svg>
              </div>
              <div class="size-demo">
                <svg class="mini" style="--s: 56px" viewBox="0 0 168 168" aria-hidden="true">
                  <path class="outer-mark" d="M137.5 49.5C124.4 29.4 102.2 17 78.2 17C39.5 17 8 48.5 8 87.2C8 125.9 39.5 157.4 78.2 157.4C109.4 157.4 136.7 136.8 145.3 107.2" fill="none" stroke="#2563eb" stroke-width="28" stroke-linecap="round" />
                  <circle class="eye" cx="66" cy="86" r="10.8" fill="#071f49" />
                  <circle class="eye" cx="102" cy="86" r="10.8" fill="#071f49" />
                </svg>
              </div>
              <div class="size-demo">
                <svg class="mini" style="--s: 76px" viewBox="0 0 168 168" aria-hidden="true">
                  <path class="outer-mark" d="M137.5 49.5C124.4 29.4 102.2 17 78.2 17C39.5 17 8 48.5 8 87.2C8 125.9 39.5 157.4 78.2 157.4C109.4 157.4 136.7 136.8 145.3 107.2" fill="none" stroke="#2563eb" stroke-width="28" stroke-linecap="round" />
                  <circle class="eye" cx="66" cy="86" r="10.8" fill="#071f49" />

              </div>
            </div>
          </article>
          <article class="card">
            <h2 class="card-title">接入建议</h2>
            <p>如果确认替换欢迎区静态图，建议先只替换欢迎区 Logo，不同步改侧边栏和 favicon，避免影响已有交互。</p>
          </article>
        </aside>
      </div>
    </section>

    <div class="footer">
      <span>文件：docs/review/小乔智投-icon交互动画预览-2026-05-21.html</span>
      <span class="status">纯 HTML/CSS/SVG，可直接回退或删除。</span>
    </div>
  </main>

  <script>
    const button = document.querySelector('.icon-button');
    button.addEventListener('click', () => {
      button.classList.toggle('is-active');
    });
  </script>
</body>
</html>
