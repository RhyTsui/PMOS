<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小乔智投 icon 宠物动画预览</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #2563eb;
      --brand-2: #2e75fe;
      --deep: #0b1f3a;
      --cyan: #14b8a6;
      --amber: #f59e0b;
      --bg: #f6f8fc;
      --line: rgba(37, 99, 235, 0.14);
      --shadow: 0 24px 80px rgba(11, 31, 58, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "HarmonyOS Sans", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--deep);
      background:
        radial-gradient(circle at 20% 18%, rgba(37, 99, 235, 0.14), transparent 30%),
        radial-gradient(circle at 78% 10%, rgba(20, 184, 166, 0.10), transparent 26%),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 52%, #edf4ff 100%);
      overflow-x: hidden;
    }

    .page {
      width: min(1180px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 720px;
      color: #52627a;
      font-size: 14px;
      line-height: 1.8;
    }

    .hint {
      padding: 8px 12px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      border-radius: 999px;
      color: #37527a;
      background: rgba(255, 255, 255, 0.76);
      font-size: 12px;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      height: min(640px, calc(100vh - 180px));
      min-height: 520px;
      border: 1px solid rgba(37, 99, 235, 0.12);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 40%, rgba(46, 117, 254, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.58));
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -20%;
      background-image:
        radial-gradient(circle, rgba(37, 99, 235, 0.14) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(20, 184, 166, 0.12) 0 1px, transparent 1.5px);
      background-size: 56px 56px, 86px 86px;
      background-position: 0 0, 28px 16px;
      opacity: 0.22;
      animation: particleFloat 28s linear infinite;
      pointer-events: none;
    }

    .stage::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: 54px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.18), transparent);
      pointer-events: none;
    }

    .playground {
      position: absolute;
      inset: 18px 34px 72px;
      border-radius: 24px;
      background:
        radial-gradient(ellipse at center bottom, rgba(37, 99, 235, 0.09), transparent 52%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.10));
      overflow: hidden;
    }

    .mascot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 150px;
      height: 150px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transform: translate3d(-50%, -50%, 0);
      outline: none;
      will-change: transform;
    }

    .mascot-core {
      position: absolute;
      inset: 0;
      transform-origin: 50% 78%;
      will-change: transform;
      filter: drop-shadow(0 22px 28px rgba(37, 99, 235, 0.24));
    }

    .mascot-shadow {
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 112px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(11, 31, 58, 0.18), transparent 70%);
      transform: translateX(-50%);
      opacity: 0.58;
      filter: blur(3px);
      will-change: transform, opacity;
    }

    .xiaoqiao-icon {
      width: 150px;
      height: 150px;
      overflow: visible;
    }

    .accessory {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 10px, 0) scale(0.76);
      transition:
        opacity 220ms cubic-bezier(0.4, 0, 0.2, 1),
        transform 260ms cubic-bezier(0.2, 0.9, 0.2, 1);
      transform-origin: center;
      z-index: 3;
    }

    .accessory {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .mascot:hover .accessory,
    .mascot.is-dressed .accessory {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .umbrella {
      left: 26px;
      top: -54px;
      width: 114px;
      height: 92px;
      transform-origin: 58px 88px;
    }

    .umbrella,
    .mascot:hover .umbrella,
    .mascot.is-dressed .umbrella {
      animation: umbrellaFloat 2.2s ease-in-out infinite;
    }

    .umbrella-canopy {
      position: absolute;
      left: 8px;
      top: 0;
      width: 98px;
      height: 50px;
      border-radius: 98px 98px 12px 12px;
      background:
        radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.82), transparent 18%),
        conic-gradient(from 205deg at 50% 100%, #2563eb, #6aa2ff 22%, #14b8a6 45%, #2563eb 70%, #0b5ee7 100%);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
      clip-path: polygon(50% 0, 100% 92%, 83% 82%, 67% 96%, 50% 84%, 32% 96%, 17% 82%, 0 92%);
    }

    .umbrella-stick {
      position: absolute;
      left: 57px;
      top: 42px;
      width: 4px;
      height: 48px;
      border-radius: 999px;
      background: linear-gradient(180deg, #0b1f3a, #315a96);
      transform: rotate(8deg);
      transform-origin: top center;
    }

    .umbrella-handle {
      position: absolute;
      left: 53px;
      top: 78px;
      width: 22px;
      height: 18px;
      border: 4px solid #315a96;
      border-top: 0;
      border-left: 0;
      border-radius: 0 0 18px 0;
      transform: rotate(8deg);
    }

    .sunglasses {
      left: 46px;
      top: 70px;
      width: 68px;
      height: 25px;
      z-index: 4;
    }

    .lens {
      position: absolute;
      top: 3px;
      width: 27px;
      height: 18px;
      border-radius: 10px 10px 12px 12px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.30), transparent 38%),
        linear-gradient(180deg, #071f49, #0b1f3a);
      box-shadow: inset 0 -4px 8px rgba(37, 99, 235, 0.25), 0 3px 8px rgba(11, 31, 58, 0.18);
    }

    .lens.left-lens {
      left: 0;
      transform: rotate(2deg);
    }

    .lens.right-lens {
      right: 0;
      transform: rotate(-2deg);
    }

    .bridge {
      position: absolute;
      left: 28px;
      top: 10px;
      width: 12px;
      height: 4px;
      border-radius: 999px;
      background: #071f49;
    }

    .tea {
      left: 91px;
      top: 94px;
      width: 42px;
      height: 54px;
      z-index: 5;
      transform-origin: 50% 20%;
    }

    .tea,
    .mascot:hover .tea,
    .mascot.is-dressed .tea {
      animation: teaSip 1.8s ease-in-out infinite;
    }

    .tea-cup {
      position: absolute;
      left: 8px;
      top: 18px;
      width: 28px;
      height: 32px;
      border: 2px solid rgba(11, 31, 58, 0.36);
      border-radius: 6px 6px 11px 11px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.48)),
        linear-gradient(180deg, #f8d08a 0 44%, #c88b4a 45% 100%);
      box-shadow: 0 8px 15px rgba(11, 31, 58, 0.12);
      overflow: hidden;
    }

    .tea-cup::before {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      top: 12px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.70);
    }

    .tea-straw {
      position: absolute;
      left: 4px;
      top: 0;
      width: 4px;
      height: 33px;
      border-radius: 999px;
      background: linear-gradient(180deg, #14b8a6, #2563eb);
      transform: rotate(-23deg);
      transform-origin: bottom center;
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.12);
    }

    .tea-lid {
      position: absolute;
      left: 5px;
      top: 15px;
      width: 33px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(11, 31, 58, 0.15);
    }

    .outer-mark {
      transform-origin: 84px 84px;
      transition: transform 180ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mascot.is-turning .outer-mark {
      animation: quickSpin 520ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .eye {
      transform-origin: center;
      transition: transform 120ms cubic-bezier(0.4, 0, 0.2, 1);
      animation: blink 5.5s infinite;
    }

    .mascot:hover .eye,
    .mascot.is-bubble .eye {
      transform: scale(1.18);
    }

    .mouth {
      opacity: 0;
      stroke-dasharray: 28;
      stroke-dashoffset: 28;
      transition: opacity 160ms ease, stroke-dashoffset 200ms ease;
    }

    .mascot.is-bubble .mouth {
      opacity: 1;
      stroke-dashoffset: 0;
    }

    .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
      opacity: 0;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(37, 99, 235, 0.26);
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95) 0 12%, transparent 13%),
        radial-gradient(circle at 62% 70%, rgba(20, 184, 166, 0.16), transparent 52%),
        rgba(255, 255, 255, 0.36);
      box-shadow: inset 0 0 18px rgba(37, 99, 235, 0.08), 0 8px 22px rgba(37, 99, 235, 0.12);
      pointer-events: none;
      animation: bubbleFly var(--duration, 2600ms) ease-out forwards;
    }

    .speech {
      position: absolute;
      left: 50%;
      top: 18px;
      max-width: min(620px, calc(100% - 48px));
      padding: 9px 14px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      border-radius: 999px;
      color: #345176;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 14px 36px rgba(11, 31, 58, 0.08);
      backdrop-filter: blur(14px);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      transform: translateX(-50%);
      z-index: 5;
    }

    .speech strong {
      color: var(--brand);
      font-weight: 600;
    }

    .controls {
      position: absolute;
      left: 34px;
      right: 34px;
      bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #65758d;
      font-size: 12px;
    }

    .control-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-btn {
      border: 1px solid rgba(37, 99, 235, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #315a96;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      transition: transform 180ms cubic-bezier(0.4, 0, 0.2, 1), border-color 180ms ease, box-shadow 180ms ease;
    }

    .control-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(46, 117, 254, 0.42);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
    }

    .note {
      margin-top: 14px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.8;
    }

    @keyframes particleFloat {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(70px, 34px, 0); }
    }

    @keyframes quickSpin {
      0% { transform: rotate(0deg) scale(1); }
      48% { transform: rotate(18deg) scale(1.08); }
      100% { transform: rotate(0deg) scale(1); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.12); }
      96% { transform: scaleY(1); }
    }

    @keyframes umbrellaFloat {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-4deg) scale(1); }
      50% { transform: translate3d(0, -5px, 0) rotate(3deg) scale(1.02); }
    }

    @keyframes teaSip {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-4deg) scale(1); }
      50% { transform: translate3d(-4px, -3px, 0) rotate(-9deg) scale(1.03); }
    }

    @keyframes bubbleFly {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.2);
      }
      10% {
        opacity: 1;
      }
      78% {
        opacity: 0.92;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--dx), var(--dy), 0) scale(var(--scale));
      }
    }

    @media (max-width: 820px) {
      .page {
        width: min(100vw - 24px, 680px);
        padding-top: 28px;
      }

      .header,
      .controls {
        display: block;
      }

      .hint {
        display: inline-block;
        margin-top: 12px;
      }

      .stage {
        min-height: 540px;
        height: calc(100vh - 140px);
      }

      .playground {
        inset: 14px 16px 106px;
      }

      .speech {
        left: 50%;
        right: auto;
        top: 14px;
        max-width: none;
        width: calc(100% - 36px);
      }

      .controls {
        left: 18px;
        right: 18px;
      }

      .control-buttons {
        margin-bottom: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>小乔智投 icon 宠物动画预览</h1>
        <p class="lead">这版不是轻微动效，而是把 icon 当作一个可互动的小助手：会在指定区域巡游、弹跳、落地回弹，点击会吹泡泡。</p>
      </div>
      <div class="hint">独立预览，不替换线上图片</div>
    </header>

    <section class="stage" aria-label="小乔智投 icon 宠物动画区域">
      <div class="playground" id="playground">
        <div class="speech">
          <strong>默认展示：</strong>巡游、弹跳、太阳伞、太阳镜和奶茶。点击吹泡泡，双击大跳。
        </div>
        <button class="mascot" id="mascot" type="button" aria-label="小乔智投动画图标">
          <span class="mascot-shadow" id="shadow"></span>
          <span class="mascot-core" id="core">
            <span class="accessory umbrella" aria-hidden="true">
              <span class="umbrella-canopy"></span>
              <span class="umbrella-stick"></span>
              <span class="umbrella-handle"></span>
            </span>
            <svg class="xiaoqiao-icon" viewBox="0 0 168 168" role="img" aria-label="小乔智投">
              <defs>
                <linearGradient id="petMarkGradient" x1="22" y1="28" x2="146" y2="142" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#2563eb" />
                  <stop offset="0.48" stop-color="#1677ff" />
                  <stop offset="1" stop-color="#0052d9" />
                </linearGradient>
                <radialGradient id="petEyeGradient" cx="35%" cy="28%" r="72%">
                  <stop offset="0" stop-color="#123d7f" />
                  <stop offset="1" stop-color="#071f49" />
                </radialGradient>
              </defs>
              <path class="outer-mark" d="M137.5 49.5C124.4 29.4 102.2 17 78.2 17C39.5 17 8 48.5 8 87.2C8 125.9 39.5 157.4 78.2 157.4C109.4 157.4 136.7 136.8 145.3 107.2" fill="none" stroke="url(#petMarkGradient)" stroke-width="28" stroke-linecap="round" />
              <circle class="eye left" cx="66" cy="86" r="10.8" fill="url(#petEyeGradient)" />
              <circle class="eye right" cx="102" cy="86" r="10.8" fill="url(#petEyeGradient)" />
              <path class="mouth" d="M74 110C81 116 90 116 96 110" fill="none" stroke="#0b1f3a" stroke-width="5" stroke-linecap="round" />
            </svg>
            <span class="accessory sunglasses" aria-hidden="true">
              <span class="lens left-lens"></span>
              <span class="bridge"></span>
              <span class="lens right-lens"></span>
            </span>
            <span class="accessory tea" aria-hidden="true">
              <span class="tea-straw"></span>
              <span class="tea-lid"></span>
              <span class="tea-cup"></span>
            </span>
          </span>
        </button>
      </div>

      <div class="controls">
        <div class="control-buttons">
          <button class="control-btn" type="button" data-action="jump">大跳一下</button>
          <button class="control-btn" type="button" data-action="bubble">吹泡泡</button>
          <button class="control-btn" type="button" data-action="dash">快速巡游</button>
          <button class="control-btn" type="button" data-action="reset">回到中间</button>
        </div>
        <div>文件：docs/review/小乔智投-icon宠物动画预览-2026-05-21.html</div>
      </div>
    </section>

    <p class="note">接入建议：如果确认使用，优先作为欢迎区域独立动画组件引入，控制在欢迎区内部，不同步影响侧边栏、顶部栏、联调组件或右侧侧边栏。</p>
  </main>

  <script>
    const playground = document.getElementById('playground');
    const mascot = document.getElementById('mascot');
    const core = document.getElementById('core');
    const shadow = document.getElementById('shadow');
    const controls = document.querySelector('.control-buttons');

    const state = {
      x: 0,
      y: 0,
      vx: 1.6,
      vy: 0,
      groundY: 0,
      jump: 0,
      squash: 0,
      direction: 1,
      targetTimer: 0,
      mouseX: null,
      mouseY: null,
      dashUntil: 0,
      lastTime: performance.now(),
    };

    function bounds() {
      const rect = playground.getBoundingClientRect();
      const size = mascot.offsetWidth || 150;
      return {
        width: rect.width,
        height: rect.height,
        minX: size * 0.58,
        maxX: rect.width - size * 0.58,
        minY: size * 0.62,
        maxY: rect.height - size * 0.58,
        size,
      };
    }

    function resetPosition() {
      const b = bounds();
      state.x = b.width * 0.5;
      state.groundY = b.height * 0.58;
      state.y = state.groundY;
      state.vx = 1.6;
      state.vy = 0;
      state.jump = 0;
      state.squash = 0;
    }

    function triggerJump(power = 16) {
      if (state.jump < 4) {
        state.vy = -power;
        state.jump = power;
        state.squash = -0.1;
        mascot.classList.add('is-turning');
        setTimeout(() => mascot.classList.remove('is-turning'), 560);
      }
    }

    function triggerDash() {
      state.dashUntil = performance.now() + 2200;
      state.vx = Math.sign(state.vx || 1) * 5.2;
      triggerJump(12);
    }

    function randomBubble() {
      const rect = mascot.getBoundingClientRect();
      const stageRect = playground.getBoundingClientRect();
      const count = 5 + Math.floor(Math.random() * 4);
      mascot.classList.add('is-bubble');
      setTimeout(() => mascot.classList.remove('is-bubble'), 720);

      for (let i = 0; i < count; i += 1) {
        const bubble = document.createElement('span');
        bubble.className = 'bubble';
        const size = 18 + Math.random() * 26;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${rect.left - stageRect.left + 88 + Math.random() * 26}px`;
        bubble.style.top = `${rect.top - stageRect.top + 58 + Math.random() * 32}px`;
        bubble.style.setProperty('--dx', `${42 + Math.random() * 130}px`);
        bubble.style.setProperty('--dy', `${-90 - Math.random() * 150}px`);
        bubble.style.setProperty('--scale', `${0.9 + Math.random() * 1.25}`);
        bubble.style.setProperty('--duration', `${1900 + Math.random() * 1200}ms`);
        playground.appendChild(bubble);
        setTimeout(() => bubble.remove(), 3400);
      }
    }

    function makeSpark() {
      const spark = document.createElement('span');
      spark.className = 'spark';
      spark.style.left = `${state.x + (Math.random() - 0.5) * 80}px`;
      spark.style.top = `${state.y + (Math.random() - 0.5) * 80}px`;
      playground.appendChild(spark);
      spark.animate([
        { opacity: 0, transform: 'translate3d(0,0,0) scale(0.2)' },
        { opacity: 1, transform: `translate3d(${(Math.random() - 0.5) * 40}px, ${-24 - Math.random() * 20}px, 0) scale(1)` },
        { opacity: 0, transform: `translate3d(${(Math.random() - 0.5) * 70}px, ${-64 - Math.random() * 36}px, 0) scale(0.4)` },
      ], { duration: 760, easing: 'ease-out' }).onfinish = () => spark.remove();
    }

    function animate(time) {
      const b = bounds();
      const dt = Math.min((time - state.lastTime) / 16.67, 2);
      state.lastTime = time;

      if (!state.x || !state.y) resetPosition();

      state.targetTimer -= dt;
      if (state.targetTimer <= 0) {
        state.targetTimer = 90 + Math.random() * 150;
        const speed = time < state.dashUntil ? 5.2 : 1.2 + Math.random() * 1.8;
        state.vx = (Math.random() > 0.5 ? 1 : -1) * speed;
        if (Math.random() > 0.52) triggerJump(10 + Math.random() * 6);
      }

      if (state.mouseX !== null) {
        const dx = state.mouseX - state.x;
        if (Math.abs(dx) > 32) {
          state.vx += Math.sign(dx) * 0.025 * dt;
          state.vx = Math.max(-3.2, Math.min(3.2, state.vx));
        }
      }

      state.x += state.vx * dt;
      if (state.x < b.minX) {
        state.x = b.minX;
        state.vx = Math.abs(state.vx) * 0.94;
        triggerJump(9);
      }
      if (state.x > b.maxX) {
        state.x = b.maxX;
        state.vx = -Math.abs(state.vx) * 0.94;
        triggerJump(9);
      }

      state.vy += 0.72 * dt;
      state.y += state.vy * dt;
      const waveGround = b.height * 0.58 + Math.sin(time / 760) * 18 + Math.sin(time / 1330) * 12;
      state.groundY += (waveGround - state.groundY) * 0.018 * dt;

      if (state.y > state.groundY) {
        state.y = state.groundY;
        if (Math.abs(state.vy) > 5) {
          state.squash = 0.22;
          if (Math.random() > 0.62) makeSpark();
        }
        state.vy = -Math.abs(state.vy) * 0.24;
        if (Math.abs(state.vy) < 1.2) state.vy = 0;
        state.jump = 0;
      }

      state.squash *= Math.pow(0.88, dt);
      state.direction = state.vx >= 0 ? 1 : -1;
      const airborne = Math.max(0, state.groundY - state.y);
      const stretch = Math.min(0.18, airborne / 380);
      const squashX = 1 + state.squash - stretch * 0.35;
      const squashY = 1 - state.squash + stretch;
      const lean = Math.max(-10, Math.min(10, state.vx * 2.2));
      const bob = Math.sin(time / 180) * (state.vy === 0 ? 2.8 : 1.2);

      mascot.style.transform = `translate3d(${state.x - b.size / 2}px, ${state.y - b.size / 2 + bob}px, 0)`;
      core.style.transform = `scaleX(${squashX * state.direction}) scaleY(${squashY}) rotate(${lean}deg)`;
      shadow.style.transform = `translateX(-50%) scale(${Math.max(0.55, 1 - airborne / 260)}, ${Math.max(0.55, 1 - airborne / 340)})`;
      shadow.style.opacity = String(Math.max(0.18, 0.62 - airborne / 300));

      requestAnimationFrame(animate);
    }

    playground.addEventListener('pointermove', (event) => {
      const rect = playground.getBoundingClientRect();
      state.mouseX = event.clientX - rect.left;
      state.mouseY = event.clientY - rect.top;
    });

    playground.addEventListener('pointerleave', () => {
      state.mouseX = null;
      state.mouseY = null;
    });

    mascot.addEventListener('click', (event) => {
      event.stopPropagation();
      randomBubble();
      triggerJump(11);
    });

    mascot.addEventListener('dblclick', (event) => {
      event.preventDefault();
      event.stopPropagation();
      triggerJump(22);
      setTimeout(randomBubble, 160);
    });

    controls.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'jump') triggerJump(22);
      if (action === 'bubble') randomBubble();
      if (action === 'dash') triggerDash();
      if (action === 'reset') resetPosition();
    });

    window.addEventListener('resize', resetPosition);
    resetPosition();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
